  script:
    - |
      argocd login $ARGOCD_SERVER --auth-token $ARGOCD_AUTH_TOKEN --grpc-web --insecure
      argocd app sync gravitee-apis-prod --grpc-web --prune --timeout 300
      argocd app wait gravitee-apis-prod --grpc-web --timeout 300
  when: manual
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"

