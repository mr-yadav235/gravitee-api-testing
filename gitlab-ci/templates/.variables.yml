# Shared Variables for GitLab CI/CD
# These variables are used across all pipelines

variables:
  # Tool versions
  KUBECONFORM_VERSION: "0.6.4"
  KUSTOMIZE_VERSION: "5.3.0"
  YQ_VERSION: "4.40.5"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  K6_VERSION: "0.49.0"
  
  # Default environment
  DEFAULT_ENVIRONMENT: "dev"
  
  # Gateway URLs (override in CI/CD settings)
  GATEWAY_URL_DEV: "https://api.dev.example.com"
  GATEWAY_URL_UAT: "https://api.uat.example.com"
  GATEWAY_URL_PROD: "https://api.example.com"
  
  # Artifact settings
  ARTIFACT_EXPIRE_TIME: "7 days"
  SECURITY_ARTIFACT_EXPIRE_TIME: "30 days"
  
  # Cache settings
  CACHE_KEY: "${CI_COMMIT_REF_SLUG}"
  
  # GKO CRDs to skip in validation
  SKIP_CRDS: "ApiDefinition,ApiV4Definition,ApiPlan,ManagementContext,Application,Subscription,SharedPolicyGroup,ClusterSecretStore,ExternalSecret,SecretStore"

