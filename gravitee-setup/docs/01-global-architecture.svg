<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="internetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="usGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="euGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="asiaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jszGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Global Multi-Region Architecture</text>
  
  <!-- Internet/Clients Section -->
  <rect x="50" y="60" width="1100" height="80" rx="10" fill="url(#internetGrad)" filter="url(#shadow)"/>
  <text x="600" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ecf0f1">GLOBAL INTERNET</text>
  
  <!-- Client Icons -->
  <g transform="translate(150, 105)">
    <circle cx="0" cy="0" r="15" fill="#3498db"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">US Clients</text>
  </g>
  <g transform="translate(400, 105)">
    <circle cx="0" cy="0" r="15" fill="#2ecc71"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">EU Clients</text>
  </g>
  <g transform="translate(650, 105)">
    <circle cx="0" cy="0" r="15" fill="#9b59b6"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">ASIA Clients</text>
  </g>
  <g transform="translate(900, 105)">
    <circle cx="0" cy="0" r="15" fill="#e74c3c"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">JSZ Clients</text>
  </g>
  
  <!-- GSLB Bar -->
  <rect x="100" y="170" width="1000" height="40" rx="5" fill="#34495e" filter="url(#shadow)"/>
  <text x="600" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ecf0f1">Global Load Balancer / GSLB / CDN (GeoDNS Routing)</text>
  
  <!-- Connection lines from clients to GSLB -->
  <line x1="150" y1="120" x2="150" y2="170" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="120" x2="400" y2="170" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="120" x2="650" y2="170" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="900" y1="120" x2="900" y2="170" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Regional Boxes -->
  <!-- US Region -->
  <g transform="translate(60, 240)">
    <rect width="220" height="280" rx="10" fill="url(#usGrad)" filter="url(#shadow)"/>
    <text x="110" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">US REGION</text>
    
    <!-- Outer DMZ -->
    <rect x="15" y="40" width="190" height="50" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="110" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">OUTER DMZ</text>
    <text x="110" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">WAF / LB / DDoS</text>
    
    <!-- Inner DMZ -->
    <rect x="15" y="100" width="190" height="70" rx="5" fill="rgba(255,255,255,0.3)"/>
    <text x="110" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">INNER DMZ</text>
    <rect x="30" y="130" width="70" height="30" rx="3" fill="url(#gatewayGrad)"/>
    <text x="65" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">GW</text>
    <rect x="115" y="130" width="70" height="30" rx="3" fill="url(#gatewayGrad)"/>
    <text x="150" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">GW</text>
    
    <!-- App Zone -->
    <rect x="15" y="180" width="190" height="50" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="110" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">APP ZONE</text>
    <text x="110" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Backend Services</text>
    
    <text x="110" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">↓ Core Zone</text>
  </g>
  
  <!-- EU Region -->
  <g transform="translate(310, 240)">
    <rect width="220" height="280" rx="10" fill="url(#euGrad)" filter="url(#shadow)"/>
    <text x="110" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">EU REGION</text>
    
    <rect x="15" y="40" width="190" height="50" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="110" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">OUTER DMZ</text>
    <text x="110" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">WAF / LB / DDoS</text>
    
    <rect x="15" y="100" width="190" height="70" rx="5" fill="rgba(255,255,255,0.3)"/>
    <text x="110" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">INNER DMZ</text>
    <rect x="30" y="130" width="70" height="30" rx="3" fill="url(#gatewayGrad)"/>
    <text x="65" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">GW</text>
    <rect x="115" y="130" width="70" height="30" rx="3" fill="url(#gatewayGrad)"/>
    <text x="150" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">GW</text>
    
    <rect x="15" y="180" width="190" height="50" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="110" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">APP ZONE</text>
    <text x="110" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Backend Services</text>
    
    <text x="110" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">↓ Core Zone</text>
  </g>
  
  <!-- ASIA Region -->
  <g transform="translate(560, 240)">
    <rect width="220" height="280" rx="10" fill="url(#asiaGrad)" filter="url(#shadow)"/>
    <text x="110" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">ASIA REGION</text>
    
    <rect x="15" y="40" width="190" height="50" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="110" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">OUTER DMZ</text>
    <text x="110" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">WAF / LB / DDoS</text>
    
    <rect x="15" y="100" width="190" height="70" rx="5" fill="rgba(255,255,255,0.3)"/>
    <text x="110" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">INNER DMZ</text>
    <rect x="30" y="130" width="70" height="30" rx="3" fill="url(#gatewayGrad)"/>
    <text x="65" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">GW</text>
    <rect x="115" y="130" width="70" height="30" rx="3" fill="url(#gatewayGrad)"/>
    <text x="150" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">GW</text>
    
    <rect x="15" y="180" width="190" height="50" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="110" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">APP ZONE</text>
    <text x="110" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Backend Services</text>
    
    <text x="110" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">↓ Core Zone</text>
  </g>
  
  <!-- JSZ Region -->
  <g transform="translate(810, 240)">
    <rect width="280" height="310" rx="10" fill="url(#jszGrad)" filter="url(#shadow)"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">JAPAN SECURE ZONE (JSZ)</text>
    
    <rect x="15" y="40" width="250" height="50" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="140" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">OUTER DMZ (Japan IPs Only)</text>
    <text x="140" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Enhanced WAF / Geo-Lock</text>
    
    <rect x="15" y="100" width="250" height="70" rx="5" fill="rgba(255,255,255,0.3)"/>
    <text x="140" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">INNER DMZ (JSZ Gateway)</text>
    <rect x="30" y="130" width="60" height="30" rx="3" fill="url(#gatewayGrad)"/>
    <text x="60" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">GW</text>
    <rect x="105" y="130" width="60" height="30" rx="3" fill="url(#gatewayGrad)"/>
    <text x="135" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">GW</text>
    <rect x="180" y="130" width="60" height="30" rx="3" fill="url(#gatewayGrad)"/>
    <text x="210" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">GW</text>
    
    <rect x="15" y="180" width="250" height="80" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="140" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">APP ZONE</text>
    
    <!-- Internal API Gateway -->
    <rect x="30" y="210" width="100" height="40" rx="3" fill="#e74c3c"/>
    <text x="80" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">Internal API</text>
    <text x="80" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">Gateway</text>
    
    <!-- Backend Services -->
    <rect x="145" y="210" width="100" height="35" rx="3" fill="rgba(255,255,255,0.3)"/>
    <text x="195" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Backend</text>
    <text x="195" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Services</text>
    
    <text x="140" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">↓ Core Zone (DB/ES)</text>
  </g>
  
  <!-- Connection lines from GSLB to regions -->
  <line x1="150" y1="210" x2="170" y2="240" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="210" x2="420" y2="240" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="210" x2="670" y2="240" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="900" y1="210" x2="950" y2="240" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Core Zone -->
  <g transform="translate(150, 560)">
    <rect width="900" height="280" rx="15" fill="url(#coreGrad)" filter="url(#shadow)"/>
    <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">CORE ZONE (Centralized Control Plane)</text>
    
    <!-- Kubernetes Cluster -->
    <rect x="20" y="50" width="500" height="200" rx="10" fill="rgba(255,255,255,0.2)"/>
    <text x="270" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">KUBERNETES CLUSTER</text>
    
    <!-- Management API -->
    <rect x="40" y="90" width="140" height="60" rx="5" fill="#2c3e50"/>
    <text x="110" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Management</text>
    <text x="110" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">API</text>
    
    <!-- Console UI -->
    <rect x="200" y="90" width="140" height="60" rx="5" fill="#2c3e50"/>
    <text x="270" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Console</text>
    <text x="270" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">UI</text>
    
    <!-- Developer Portal -->
    <rect x="360" y="90" width="140" height="60" rx="5" fill="#2c3e50"/>
    <text x="430" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Developer</text>
    <text x="430" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Portal</text>
    
    <!-- Internal Gateway -->
    <rect x="40" y="165" width="140" height="60" rx="5" fill="url(#gatewayGrad)"/>
    <text x="110" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Internal</text>
    <text x="110" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">API Gateway</text>
    
    <!-- Data Stores -->
    <rect x="540" y="50" width="340" height="200" rx="10" fill="rgba(255,255,255,0.2)"/>
    <text x="710" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">SHARED DATA STORES</text>
    
    <!-- MySQL -->
    <rect x="560" y="90" width="140" height="70" rx="5" fill="#4db33d"/>
    <text x="630" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">MySQL</text>
    <text x="630" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Database (Shared)</text>
    
    <!-- Elasticsearch -->
    <rect x="720" y="90" width="140" height="70" rx="5" fill="#f9b110"/>
    <text x="790" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Elasticsearch</text>
    <text x="790" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Cloud (Shared)</text>
    
    <!-- Note -->
    <text x="710" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">All regions connect here</text>
    <text x="710" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">(US, EU, ASIA, JSZ)</text>
  </g>
  
  <!-- Connection lines from regions to Core Zone -->
  <line x1="170" y1="520" x2="300" y2="560" stroke="#3498db" stroke-width="3" stroke-dasharray="5,5"/>
  <line x1="420" y1="520" x2="450" y2="560" stroke="#2ecc71" stroke-width="3" stroke-dasharray="5,5"/>
  <line x1="670" y1="520" x2="600" y2="560" stroke="#9b59b6" stroke-width="3" stroke-dasharray="5,5"/>
  <line x1="950" y1="520" x2="850" y2="560" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- Legend -->
  <g transform="translate(50, 860)">
    <rect x="0" y="0" width="15" height="15" fill="#3498db"/>
    <text x="20" y="12" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">US Region</text>
    <rect x="100" y="0" width="15" height="15" fill="#2ecc71"/>
    <text x="120" y="12" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">EU Region</text>
    <rect x="200" y="0" width="15" height="15" fill="#9b59b6"/>
    <text x="220" y="12" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">ASIA Region</text>
    <rect x="310" y="0" width="15" height="15" fill="#e74c3c"/>
    <text x="330" y="12" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">JSZ (Japan)</text>
    <rect x="420" y="0" width="15" height="15" fill="#f39c12"/>
    <text x="440" y="12" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Core Zone</text>
    <rect x="530" y="0" width="15" height="15" fill="#1abc9c"/>
    <text x="550" y="12" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">API Gateway</text>
  </g>
</svg>

