<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="jszBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0392b;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="jszHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c0392b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="securityGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gatewayGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coreGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#c0392b">Japan Secure Zone (JSZ) Architecture</text>
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Uses Core Zone MongoDB &amp; Elasticsearch</text>
  
  <!-- JSZ Main Container -->
  <rect x="50" y="70" width="800" height="400" rx="15" fill="url(#jszBg)" stroke="#c0392b" stroke-width="2"/>
  <rect x="50" y="70" width="800" height="45" rx="15" fill="url(#jszHeader)"/>
  <rect x="50" y="100" width="800" height="15" fill="url(#jszHeader)"/>
  <text x="450" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">JAPAN SECURE ZONE (JSZ)</text>
  
  <!-- Security Boundary Label -->
  <rect x="320" y="125" width="260" height="30" rx="5" fill="#2c3e50"/>
  <text x="450" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1">🔒 Security Boundary (Japan Traffic Only)</text>
  
  <!-- JSZ Outer DMZ -->
  <g transform="translate(80, 170)">
    <rect width="740" height="80" rx="10" fill="url(#securityGrad)" filter="url(#shadow2)"/>
    <text x="370" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">JSZ OUTER DMZ (Japan IPs Only)</text>
    
    <!-- Security Components -->
    <rect x="30" y="40" width="100" height="30" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="80" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">WAF Enhanced</text>
    
    <rect x="150" y="40" width="100" height="30" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="200" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">IDS/IPS</text>
    
    <rect x="270" y="40" width="100" height="30" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="320" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Japan Geo-Lock</text>
    
    <rect x="390" y="40" width="100" height="30" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="440" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">IP Allowlist</text>
    
    <rect x="510" y="40" width="100" height="30" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="560" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Load Balancer</text>
    
    <rect x="630" y="40" width="80" height="30" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="670" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">SSL/TLS</text>
  </g>
  
  <!-- Arrow from Outer to Inner -->
  <line x1="450" y1="250" x2="450" y2="270" stroke="#555" stroke-width="3" marker-end="url(#arrow2)"/>
  <text x="470" y="265" font-family="Arial, sans-serif" font-size="9" fill="#555">Japan Traffic</text>
  
  <!-- JSZ Inner DMZ -->
  <g transform="translate(80, 280)">
    <rect width="740" height="100" rx="10" fill="#feca57" filter="url(#shadow2)"/>
    <text x="370" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">JSZ INNER DMZ (API Gateway Cluster)</text>
    
    <!-- Gateway Instances -->
    <rect x="80" y="40" width="120" height="50" rx="8" fill="url(#gatewayGrad2)"/>
    <text x="140" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Gateway #1</text>
    <text x="140" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Japan</text>
    
    <rect x="230" y="40" width="120" height="50" rx="8" fill="url(#gatewayGrad2)"/>
    <text x="290" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Gateway #2</text>
    <text x="290" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Japan</text>
    
    <rect x="380" y="40" width="120" height="50" rx="8" fill="url(#gatewayGrad2)"/>
    <text x="440" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Gateway #3</text>
    <text x="440" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Japan</text>
    
    <!-- Connection indicator -->
    <rect x="540" y="40" width="170" height="50" rx="8" fill="#2c3e50"/>
    <text x="625" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Core Zone DB</text>
    <text x="625" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Core Zone ES</text>
  </g>
  
  <!-- Arrow from Inner to App -->
  <line x1="300" y1="380" x2="300" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  
  <!-- JSZ App Zone -->
  <g transform="translate(80, 400)">
    <rect width="350" height="60" rx="10" fill="url(#appGrad)" filter="url(#shadow2)"/>
    <text x="175" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">JSZ APP ZONE</text>
    <text x="175" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Japan Backend Services Only</text>
  </g>
  
  <!-- Blocked Section -->
  <g transform="translate(470, 400)">
    <rect width="350" height="60" rx="10" fill="#2c3e50" filter="url(#shadow2)"/>
    <text x="175" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">❌ BLOCKED CONNECTIONS</text>
    <text x="175" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#bdc3c7">Internet • US • EU • ASIA Regions</text>
  </g>
  
  <!-- VPN Connection Line -->
  <path d="M 450 380 Q 550 420 700 490" stroke="#27ae60" stroke-width="3" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowGreen)"/>
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">VPN / Secure Channel</text>
  
  <!-- Core Zone -->
  <g transform="translate(150, 510)">
    <rect width="600" height="150" rx="15" fill="url(#coreGrad2)" filter="url(#shadow2)"/>
    <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">CORE ZONE (Shared Infrastructure)</text>
    
    <!-- MongoDB -->
    <rect x="50" y="50" width="160" height="70" rx="8" fill="#4db33d"/>
    <text x="130" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">MongoDB Atlas</text>
    <text x="130" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">(Shared)</text>
    
    <!-- Elasticsearch -->
    <rect x="240" y="50" width="160" height="70" rx="8" fill="#f9b110"/>
    <text x="320" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Elasticsearch</text>
    <text x="320" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">(Shared)</text>
    
    <!-- What JSZ uses -->
    <rect x="430" y="50" width="140" height="70" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="500" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">JSZ Uses:</text>
    <text x="500" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">• Config Sync</text>
    <text x="500" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">• Rate Limiting</text>
    <text x="500" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">• Analytics</text>
  </g>
  
  <!-- Key Features Box -->
  <g transform="translate(50, 480)">
    <rect width="80" height="180" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">JSZ</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Features</text>
    <text x="40" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">✓ Japan IPs</text>
    <text x="40" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">✓ Core DB</text>
    <text x="40" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">✓ Core ES</text>
    <text x="40" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">✓ Auto Sync</text>
    <text x="40" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c">✗ Internet</text>
    <text x="40" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c">✗ US/EU/ASIA</text>
  </g>
</svg>

