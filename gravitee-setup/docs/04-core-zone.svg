<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <defs>
    <linearGradient id="coreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:0.08" />
    </linearGradient>
    <linearGradient id="coreHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="k8sGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#326ce5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2857b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mongoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4db33d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d8c30;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="esGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f9b110;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d99a0d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7d3c98;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="internalGwGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d68910">Core Zone Architecture</text>
  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Centralized Control Plane &amp; Shared Data Stores</text>
  
  <!-- Core Zone Container -->
  <rect x="30" y="70" width="940" height="500" rx="15" fill="url(#coreBg)" stroke="#f39c12" stroke-width="2"/>
  <rect x="30" y="70" width="940" height="45" rx="15" fill="url(#coreHeader)"/>
  <rect x="30" y="100" width="940" height="15" fill="url(#coreHeader)"/>
  <text x="500" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">CORE ZONE</text>
  
  <!-- Kubernetes Cluster Section -->
  <g transform="translate(50, 130)">
    <rect width="550" height="420" rx="12" fill="url(#k8sGrad)" filter="url(#shadow3)"/>
    <text x="275" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">☸ KUBERNETES CLUSTER (Multi-AZ)</text>
    
    <!-- Management API -->
    <rect x="20" y="55" width="160" height="90" rx="8" fill="url(#apiGrad)" filter="url(#shadow3)"/>
    <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Management</text>
    <text x="100" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">API</text>
    <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">3 Replicas</text>
    
    <!-- Console UI -->
    <rect x="195" y="55" width="160" height="90" rx="8" fill="url(#uiGrad)" filter="url(#shadow3)"/>
    <text x="275" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Console</text>
    <text x="275" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">UI</text>
    <text x="275" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Admin Interface</text>
    
    <!-- Developer Portal -->
    <rect x="370" y="55" width="160" height="90" rx="8" fill="url(#portalGrad)" filter="url(#shadow3)"/>
    <text x="450" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Developer</text>
    <text x="450" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Portal</text>
    <text x="450" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">API Catalog</text>
    
    <!-- Internal Gateway -->
    <rect x="20" y="165" width="250" height="90" rx="8" fill="url(#internalGwGrad)" filter="url(#shadow3)"/>
    <text x="145" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Internal API Gateway</text>
    <text x="145" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">For Internal Applications</text>
    <text x="145" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">No Internet Exposure</text>
    
    <!-- Responsibilities Box -->
    <rect x="20" y="275" width="510" height="125" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="275" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Responsibilities</text>
    
    <text x="40" y="325" font-family="Arial, sans-serif" font-size="10" fill="white">• API lifecycle management</text>
    <text x="40" y="345" font-family="Arial, sans-serif" font-size="10" fill="white">• Policy configuration</text>
    <text x="40" y="365" font-family="Arial, sans-serif" font-size="10" fill="white">• User/application management</text>
    <text x="40" y="385" font-family="Arial, sans-serif" font-size="10" fill="white">• Gateway registration</text>
    
    <text x="280" y="325" font-family="Arial, sans-serif" font-size="10" fill="white">• Config distribution to all regions</text>
    <text x="280" y="345" font-family="Arial, sans-serif" font-size="10" fill="white">• Analytics aggregation</text>
    <text x="280" y="365" font-family="Arial, sans-serif" font-size="10" fill="white">• Internal API routing</text>
    <text x="280" y="385" font-family="Arial, sans-serif" font-size="10" fill="white">• Centralized monitoring</text>
  </g>
  
  <!-- Data Stores Section -->
  <g transform="translate(620, 130)">
    <rect width="330" height="420" rx="12" fill="#2c3e50" filter="url(#shadow3)"/>
    <text x="165" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">SHARED DATA STORES</text>
    
    <!-- MySQL -->
    <rect x="20" y="55" width="290" height="130" rx="10" fill="url(#mongoGrad)" filter="url(#shadow3)"/>
    <text x="165" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">🗄️ MySQL Database</text>
    <text x="165" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">On-Premise Cluster</text>
    
    <rect x="35" y="120" width="120" height="50" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="95" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">API Definitions</text>
    <text x="95" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Plans • Subs</text>
    
    <rect x="170" y="120" width="125" height="50" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="232" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Rate Limits</text>
    <text x="232" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">All Regions</text>
    
    <!-- Elasticsearch -->
    <rect x="20" y="200" width="290" height="130" rx="10" fill="url(#esGrad)" filter="url(#shadow3)"/>
    <text x="165" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">🔍 Elasticsearch</text>
    <text x="165" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">On-Premise Cluster</text>
    
    <rect x="35" y="265" width="120" height="50" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="95" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Request Logs</text>
    <text x="95" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">All Regions</text>
    
    <rect x="170" y="265" width="125" height="50" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="232" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Analytics</text>
    <text x="232" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Metrics</text>
    
    <!-- Connections Info -->
    <rect x="20" y="345" width="290" height="55" rx="8" fill="rgba(255,255,255,0.1)"/>
    <text x="165" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#27ae60">✓ Connected Regions:</text>
    <text x="165" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">US • EU • ASIA • JSZ • Internal</text>
  </g>
  
  <!-- Regional Connections -->
  <g transform="translate(50, 560)">
    <rect width="900" height="30" rx="5" fill="#ecf0f1"/>
    <text x="450" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      ← US Region    ← EU Region    ← ASIA Region    ← JSZ (Japan)    ← Internal Apps
    </text>
  </g>
  
  <!-- Connection arrows from regions (symbolic) -->
  <line x1="100" y1="555" x2="100" y2="540" stroke="#3498db" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="280" y1="555" x2="280" y2="540" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="460" y1="555" x2="460" y2="540" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="640" y1="555" x2="640" y2="540" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="820" y1="555" x2="820" y2="540" stroke="#f39c12" stroke-width="2" marker-end="url(#arrow3)"/>
</svg>

