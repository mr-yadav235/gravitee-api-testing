<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650">
  <defs>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gwGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4db33d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d8c30;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="esGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f9b110;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d99a0d;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrowGreen2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6"/>
    </marker>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">API Request Data Flow</text>
  <text x="550" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">From Client Request to Backend Response</text>
  
  <!-- Step Numbers and Flow -->
  <!-- Step 1: Client -->
  <g transform="translate(50, 100)">
    <circle cx="30" cy="30" r="25" fill="url(#clientGrad)" filter="url(#shadow4)"/>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">1</text>
    <rect x="70" y="5" width="150" height="50" rx="8" fill="url(#clientGrad)" filter="url(#shadow4)"/>
    <text x="145" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">API Client</text>
    <text x="145" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">HTTPS Request</text>
    <text x="145" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Client sends API request</text>
  </g>
  
  <!-- Arrow 1→2 -->
  <line x1="235" y1="130" x2="310" y2="130" stroke="#3498db" stroke-width="3" marker-end="url(#arrowBlue)"/>
  
  <!-- Step 2: GSLB -->
  <g transform="translate(320, 100)">
    <circle cx="30" cy="30" r="25" fill="#34495e" filter="url(#shadow4)"/>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">2</text>
    <rect x="70" y="5" width="150" height="50" rx="8" fill="#34495e" filter="url(#shadow4)"/>
    <text x="145" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">GSLB / CDN</text>
    <text x="145" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">GeoDNS Routing</text>
    <text x="145" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Route to nearest region</text>
  </g>
  
  <!-- Arrow 2→3 -->
  <line x1="505" y1="130" x2="580" y2="130" stroke="#3498db" stroke-width="3" marker-end="url(#arrowBlue)"/>
  
  <!-- Step 3: WAF/LB -->
  <g transform="translate(590, 100)">
    <circle cx="30" cy="30" r="25" fill="url(#wafGrad)" filter="url(#shadow4)"/>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">3</text>
    <rect x="70" y="5" width="150" height="50" rx="8" fill="url(#wafGrad)" filter="url(#shadow4)"/>
    <text x="145" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">WAF / Load Balancer</text>
    <text x="145" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Outer DMZ</text>
    <text x="145" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Security filtering</text>
  </g>
  
  <!-- Arrow 3→4 -->
  <line x1="775" y1="130" x2="850" y2="130" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowBlue)"/>
  
  <!-- Step 4: API Gateway -->
  <g transform="translate(860, 100)">
    <circle cx="30" cy="30" r="25" fill="url(#gwGrad)" filter="url(#shadow4)"/>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">4</text>
    <rect x="70" y="5" width="150" height="50" rx="8" fill="url(#gwGrad)" filter="url(#shadow4)"/>
    <text x="145" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">API Gateway</text>
    <text x="145" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Inner DMZ</text>
    <text x="145" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Policy enforcement</text>
  </g>
  
  <!-- Gateway Detail Box -->
  <g transform="translate(100, 220)">
    <rect width="900" height="180" rx="12" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">API Gateway Processing (Step 4 Detail)</text>
    
    <!-- Sub-steps -->
    <rect x="30" y="50" width="160" height="110" rx="8" fill="#9b59b6" filter="url(#shadow4)"/>
    <text x="110" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">4a. Authentication</text>
    <text x="110" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">API Key / OAuth</text>
    <text x="110" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">JWT Validation</text>
    <text x="110" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">→ MySQL</text>
    
    <line x1="200" y1="105" x2="230" y2="105" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowPurple)"/>
    
    <rect x="240" y="50" width="160" height="110" rx="8" fill="#e67e22" filter="url(#shadow4)"/>
    <text x="320" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">4b. Rate Limiting</text>
    <text x="320" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Quota Check</text>
    <text x="320" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Spike Arrest</text>
    <text x="320" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">→ MySQL</text>
    
    <line x1="410" y1="105" x2="440" y2="105" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowOrange)"/>
    
    <rect x="450" y="50" width="160" height="110" rx="8" fill="#2ecc71" filter="url(#shadow4)"/>
    <text x="530" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">4c. Transformation</text>
    <text x="530" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Request Mapping</text>
    <text x="530" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Header Injection</text>
    <text x="530" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">Policy Engine</text>
    
    <line x1="620" y1="105" x2="650" y2="105" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowGreen2)"/>
    
    <rect x="660" y="50" width="210" height="110" rx="8" fill="#3498db" filter="url(#shadow4)"/>
    <text x="765" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">4d. Logging &amp; Analytics</text>
    <text x="765" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Request/Response Logging</text>
    <text x="765" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Metrics Collection</text>
    <text x="765" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">→ Elasticsearch (Async)</text>
  </g>
  
  <!-- Step 5: Backend -->
  <g transform="translate(50, 430)">
    <circle cx="30" cy="30" r="25" fill="url(#backendGrad)" filter="url(#shadow4)"/>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">5</text>
    <rect x="70" y="5" width="180" height="50" rx="8" fill="url(#backendGrad)" filter="url(#shadow4)"/>
    <text x="160" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Backend Service</text>
    <text x="160" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">App Zone</text>
    <text x="160" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Process business logic</text>
  </g>
  
  <!-- Arrow Gateway to Backend -->
  <path d="M 950 200 Q 950 350 265 430" stroke="#1abc9c" stroke-width="3" fill="none" marker-end="url(#arrowGreen2)"/>
  
  <!-- Core Zone Data Stores -->
  <g transform="translate(350, 430)">
    <rect width="350" height="100" rx="12" fill="#2c3e50" filter="url(#shadow4)"/>
    <text x="175" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">CORE ZONE - Data Stores</text>
    
    <rect x="20" y="40" width="140" height="45" rx="6" fill="url(#dbGrad)"/>
    <text x="90" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">MySQL</text>
    
    <rect x="190" y="40" width="140" height="45" rx="6" fill="url(#esGrad2)"/>
    <text x="260" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Elasticsearch</text>
  </g>
  
  <!-- Arrows to Core Zone -->
  <line x1="450" y1="400" x2="450" y2="430" stroke="#4db33d" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="600" y1="400" x2="600" y2="430" stroke="#f9b110" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Response Flow -->
  <g transform="translate(750, 430)">
    <circle cx="30" cy="30" r="25" fill="#27ae60" filter="url(#shadow4)"/>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">6</text>
    <rect x="70" y="5" width="180" height="50" rx="8" fill="#27ae60" filter="url(#shadow4)"/>
    <text x="160" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Response</text>
    <text x="160" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Back to Client</text>
    <text x="160" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Same path reversed</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 560)">
    <rect width="1000" height="70" rx="8" fill="#ecf0f1"/>
    <text x="500" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Data Flow Legend</text>
    
    <line x1="50" y1="45" x2="100" y2="45" stroke="#3498db" stroke-width="3"/>
    <text x="110" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Request Flow</text>
    
    <line x1="220" y1="45" x2="270" y2="45" stroke="#27ae60" stroke-width="3"/>
    <text x="280" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Response Flow</text>
    
    <line x1="400" y1="45" x2="450" y2="45" stroke="#4db33d" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="460" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">DB Sync (Async)</text>
    
    <line x1="600" y1="45" x2="650" y2="45" stroke="#f9b110" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="660" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Analytics (Async)</text>
    
    <rect x="800" y="38" width="15" height="15" fill="#1abc9c"/>
    <text x="825" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">API Gateway</text>
  </g>
</svg>

