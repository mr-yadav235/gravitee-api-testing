<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100">
  <defs>
    <linearGradient id="outerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34495e;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="consumersGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coreZoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gwClusterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="internalAppGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="adminGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d35400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cicdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e8449;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serviceBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowDown" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#3498db"/>
    </marker>
    <marker id="arrowDownRed" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="1100" fill="#f8f9fa"/>
  
  <!-- ==================== MAIN CONTAINER ==================== -->
  <rect x="20" y="20" width="960" height="1060" rx="15" fill="url(#outerBg)" stroke="#34495e" stroke-width="3"/>
  
  <!-- Title -->
  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">INTERNAL API GATEWAY ARCHITECTURE</text>

  <!-- ==================== INTERNAL CONSUMERS SECTION ==================== -->
  <rect x="40" y="80" width="920" height="220" rx="12" fill="url(#consumersGrad)" filter="url(#shadow)"/>
  <text x="500" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">INTERNAL CONSUMERS</text>

  <!-- Internal Apps -->
  <rect x="60" y="130" width="200" height="150" rx="8" fill="url(#internalAppGrad)" filter="url(#shadow)"/>
  <text x="160" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Internal</text>
  <text x="160" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Apps</text>
  <rect x="75" y="185" width="170" height="80" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="160" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• CRM</text>
  <text x="160" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• ERP</text>
  <text x="160" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• HR System</text>

  <!-- Admin Tools -->
  <rect x="280" y="130" width="200" height="150" rx="8" fill="url(#adminGrad)" filter="url(#shadow)"/>
  <text x="380" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Admin</text>
  <text x="380" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Tools</text>
  <rect x="295" y="185" width="170" height="80" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="380" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Grafana</text>
  <text x="380" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Kibana</text>
  <text x="380" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Admin UI</text>

  <!-- CI/CD Pipelines -->
  <rect x="500" y="130" width="200" height="150" rx="8" fill="url(#cicdGrad)" filter="url(#shadow)"/>
  <text x="600" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">CI/CD</text>
  <text x="600" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Pipelines</text>
  <rect x="515" y="185" width="170" height="80" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="600" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Jenkins</text>
  <text x="600" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• ArgoCD</text>
  <text x="600" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• GitLab</text>

  <!-- Backend Services (Consumers) -->
  <rect x="720" y="130" width="220" height="150" rx="8" fill="url(#serviceBoxGrad)" filter="url(#shadow)"/>
  <text x="830" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Backend</text>
  <text x="830" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Services</text>
  <rect x="735" y="185" width="190" height="80" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="830" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Payment</text>
  <text x="830" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Inventory</text>
  <text x="830" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Billing</text>

  <!-- Connection lines from consumers -->
  <line x1="160" y1="280" x2="160" y2="310" stroke="#3498db" stroke-width="2"/>
  <line x1="380" y1="280" x2="380" y2="310" stroke="#e67e22" stroke-width="2"/>
  <line x1="600" y1="280" x2="600" y2="310" stroke="#27ae60" stroke-width="2"/>
  <line x1="830" y1="280" x2="830" y2="310" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Merge lines -->
  <line x1="160" y1="310" x2="500" y2="310" stroke="#555" stroke-width="2"/>
  <line x1="830" y1="310" x2="500" y2="310" stroke="#555" stroke-width="2"/>
  <line x1="500" y1="310" x2="500" y2="340" stroke="#555" stroke-width="3" marker-end="url(#arrowDown)"/>
  
  <!-- Label -->
  <text x="500" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Internal Network Only (No Internet Access)</text>

  <!-- ==================== CORE ZONE ==================== -->
  <rect x="40" y="375" width="920" height="680" rx="12" fill="url(#coreZoneGrad)" filter="url(#shadow)"/>
  <text x="500" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">CORE ZONE</text>

  <!-- ========== INTERNAL API GATEWAY CLUSTER ========== -->
  <rect x="60" y="425" width="880" height="280" rx="10" fill="url(#gwClusterGrad)" filter="url(#shadow)"/>
  <text x="500" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">INTERNAL API GATEWAY CLUSTER</text>

  <!-- Internal GW #1 -->
  <rect x="90" y="475" width="250" height="210" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="215" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Internal GW #1</text>
  <text x="215" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">(Active)</text>
  <text x="215" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">Port: 8082</text>
  <rect x="110" y="560" width="210" height="110" rx="5" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="215" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Policies:</text>
  <text x="215" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• mTLS</text>
  <text x="215" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• JWT</text>
  <text x="215" y="636" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Rate Limit</text>
  <text x="215" y="654" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Logging</text>

  <!-- Internal GW #2 -->
  <rect x="370" y="475" width="250" height="210" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="495" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Internal GW #2</text>
  <text x="495" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">(Active)</text>
  <text x="495" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">Port: 8082</text>
  <rect x="390" y="560" width="210" height="110" rx="5" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="495" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Policies:</text>
  <text x="495" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• mTLS</text>
  <text x="495" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• JWT</text>
  <text x="495" y="636" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Rate Limit</text>
  <text x="495" y="654" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Logging</text>

  <!-- Internal GW #3 -->
  <rect x="650" y="475" width="250" height="210" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="775" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Internal GW #3</text>
  <text x="775" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">(Active)</text>
  <text x="775" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">Port: 8082</text>
  <rect x="670" y="560" width="210" height="110" rx="5" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="775" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Policies:</text>
  <text x="775" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• mTLS</text>
  <text x="775" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• JWT</text>
  <text x="775" y="636" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Rate Limit</text>
  <text x="775" y="654" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Logging</text>

  <!-- Arrow down from Gateway Cluster -->
  <line x1="215" y1="685" x2="215" y2="720" stroke="white" stroke-width="2"/>
  <line x1="495" y1="685" x2="495" y2="720" stroke="white" stroke-width="2"/>
  <line x1="775" y1="685" x2="775" y2="720" stroke="white" stroke-width="2"/>
  <line x1="215" y1="720" x2="775" y2="720" stroke="white" stroke-width="2"/>
  <line x1="500" y1="720" x2="500" y2="755" stroke="white" stroke-width="3" marker-end="url(#arrowDownRed)"/>

  <!-- ========== INTERNAL BACKEND SERVICES ========== -->
  <rect x="60" y="770" width="880" height="265" rx="10" fill="url(#backendGrad)" filter="url(#shadow)"/>
  <text x="500" y="800" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">INTERNAL BACKEND SERVICES</text>

  <!-- Row 1: 4 services -->
  <rect x="80" y="820" width="190" height="80" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="175" y="845" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">User Service</text>
  <text x="175" y="865" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">/api/users</text>
  <text x="175" y="885" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2ecc71">Port: 8081</text>

  <rect x="290" y="820" width="190" height="80" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="385" y="845" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Inventory Service</text>
  <text x="385" y="865" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">/api/inventory</text>
  <text x="385" y="885" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2ecc71">Port: 8082</text>

  <rect x="500" y="820" width="190" height="80" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="595" y="845" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Payment Service</text>
  <text x="595" y="865" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">/api/payment</text>
  <text x="595" y="885" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2ecc71">Port: 8083</text>

  <rect x="710" y="820" width="190" height="80" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="805" y="845" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Reporting Service</text>
  <text x="805" y="865" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">/api/reports</text>
  <text x="805" y="885" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2ecc71">Port: 8084</text>

  <!-- Row 2: 4 services -->
  <rect x="80" y="915" width="190" height="80" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="175" y="940" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Auth Service</text>
  <text x="175" y="960" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">/api/auth</text>
  <text x="175" y="980" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2ecc71">Port: 8085</text>

  <rect x="290" y="915" width="190" height="80" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="385" y="940" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Config Service</text>
  <text x="385" y="960" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">/api/config</text>
  <text x="385" y="980" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2ecc71">Port: 8086</text>

  <rect x="500" y="915" width="190" height="80" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="595" y="940" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Messaging Service</text>
  <text x="595" y="960" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">/api/messages</text>
  <text x="595" y="980" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2ecc71">Port: 8087</text>

  <rect x="710" y="915" width="190" height="80" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="805" y="940" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Audit Service</text>
  <text x="805" y="960" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">/api/audit</text>
  <text x="805" y="980" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2ecc71">Port: 8088</text>

  <!-- Footer note -->
  <rect x="60" y="1010" width="880" height="35" rx="6" fill="rgba(39, 174, 96, 0.3)"/>
  <text x="500" y="1032" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2ecc71">Uses same MySQL and Elasticsearch as external gateways</text>
</svg>
