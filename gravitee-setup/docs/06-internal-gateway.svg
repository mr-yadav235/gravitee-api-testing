<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="internalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="internalHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="appGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coreGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowInternal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="550" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#e74c3c">Internal API Gateway Architecture</text>
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">For Internal Applications - No Internet Exposure</text>
  
  <!-- Core Zone Container -->
  <rect x="30" y="70" width="840" height="440" rx="15" fill="url(#internalBg)" stroke="#f39c12" stroke-width="2"/>
  <rect x="30" y="70" width="840" height="45" rx="15" fill="url(#coreGrad3)"/>
  <rect x="30" y="100" width="840" height="15" fill="url(#coreGrad3)"/>
  <text x="450" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">CORE ZONE</text>
  
  <!-- Internal Applications Section -->
  <g transform="translate(50, 130)">
    <rect width="250" height="350" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <rect width="250" height="35" rx="10" fill="url(#appGrad2)"/>
    <text x="125" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Internal Applications</text>
    
    <!-- App Icons -->
    <rect x="20" y="55" width="210" height="50" rx="5" fill="#2c3e50"/>
    <text x="125" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">🖥️ Admin Dashboard</text>
    <text x="125" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">Internal Management UI</text>
    
    <rect x="20" y="115" width="210" height="50" rx="5" fill="#2c3e50"/>
    <text x="125" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">📊 Reporting Service</text>
    <text x="125" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">Analytics &amp; Reports</text>
    
    <rect x="20" y="175" width="210" height="50" rx="5" fill="#2c3e50"/>
    <text x="125" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">🔧 DevOps Tools</text>
    <text x="125" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">CI/CD &amp; Monitoring</text>
    
    <rect x="20" y="235" width="210" height="50" rx="5" fill="#2c3e50"/>
    <text x="125" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">🔐 Security Scanner</text>
    <text x="125" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">Vulnerability Scanning</text>
    
    <rect x="20" y="295" width="210" height="40" rx="5" fill="#27ae60"/>
    <text x="125" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">+ More Internal Apps</text>
  </g>
  
  <!-- Arrows from Apps to Gateway -->
  <line x1="310" y1="200" x2="360" y2="200" stroke="#3498db" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="310" y1="260" x2="360" y2="260" stroke="#3498db" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="310" y1="320" x2="360" y2="320" stroke="#3498db" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="310" y1="380" x2="360" y2="380" stroke="#3498db" stroke-width="2" marker-end="url(#arrow5)"/>
  
  <!-- Internal Gateway -->
  <g transform="translate(370, 130)">
    <rect width="200" height="350" rx="10" fill="url(#internalHeader)" filter="url(#shadow5)"/>
    <text x="100" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Internal API</text>
    <text x="100" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Gateway</text>
    
    <!-- Features -->
    <rect x="15" y="70" width="170" height="40" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="100" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">🔐 Authentication</text>
    
    <rect x="15" y="120" width="170" height="40" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="100" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">📋 Rate Limiting</text>
    
    <rect x="15" y="170" width="170" height="40" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="100" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">📊 Analytics</text>
    
    <rect x="15" y="220" width="170" height="40" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="100" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">🔄 Load Balancing</text>
    
    <rect x="15" y="270" width="170" height="40" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="100" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">📝 Audit Logging</text>
    
    <!-- No Internet Badge -->
    <rect x="15" y="320" width="170" height="25" rx="3" fill="#2c3e50"/>
    <text x="100" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">❌ No Internet Exposure</text>
  </g>
  
  <!-- Arrows from Gateway to Services -->
  <line x1="580" y1="200" x2="620" y2="200" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowInternal)"/>
  <line x1="580" y1="280" x2="620" y2="280" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowInternal)"/>
  <line x1="580" y1="360" x2="620" y2="360" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowInternal)"/>
  
  <!-- Internal Services -->
  <g transform="translate(630, 130)">
    <rect width="220" height="350" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <rect width="220" height="35" rx="10" fill="url(#serviceGrad)"/>
    <text x="110" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Internal Backend Services</text>
    
    <rect x="15" y="55" width="190" height="70" rx="5" fill="#2c3e50"/>
    <text x="110" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">User Management API</text>
    <text x="110" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">Internal user operations</text>
    <text x="110" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">Port: 8081</text>
    
    <rect x="15" y="135" width="190" height="70" rx="5" fill="#2c3e50"/>
    <text x="110" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Configuration API</text>
    <text x="110" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">System configuration</text>
    <text x="110" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">Port: 8082</text>
    
    <rect x="15" y="215" width="190" height="70" rx="5" fill="#2c3e50"/>
    <text x="110" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Metrics API</text>
    <text x="110" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">System metrics &amp; health</text>
    <text x="110" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">Port: 8083</text>
    
    <rect x="15" y="295" width="190" height="40" rx="5" fill="#27ae60"/>
    <text x="110" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">+ More Internal APIs</text>
  </g>
  
  <!-- Comparison Box -->
  <g transform="translate(50, 495)">
    <rect width="800" height="45" rx="8" fill="#2c3e50"/>
    <text x="400" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Internal Gateway vs External Gateway</text>
    <text x="200" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Same policies &amp; management</text>
    <text x="450" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Centralized analytics</text>
    <text x="680" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">✗ No public internet access</text>
  </g>
</svg>

