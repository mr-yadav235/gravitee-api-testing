<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="usBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="euBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="asiaBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coreBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jszBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowBidir" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowOneWay" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="550" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Inter-Region Communication Matrix</text>
  <text x="450" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">VPN / PrivateLink Topology</text>
  
  <!-- Top Row: US, Core, EU -->
  <g transform="translate(50, 80)">
    <!-- US Region -->
    <rect x="0" y="0" width="180" height="100" rx="10" fill="url(#usBox)" filter="url(#shadow7)"/>
    <text x="90" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">US Region</text>
    <text x="90" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Global Gateway</text>
    <text x="90" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Shared</text>
    
    <!-- Core Zone -->
    <rect x="250" y="0" width="180" height="100" rx="10" fill="url(#coreBox)" filter="url(#shadow7)"/>
    <text x="340" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Core Zone</text>
    <text x="340" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Control Plane</text>
    <text x="340" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">+ Data Stores</text>
    
    <!-- EU Region -->
    <rect x="500" y="0" width="180" height="100" rx="10" fill="url(#euBox)" filter="url(#shadow7)"/>
    <text x="590" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">EU Region</text>
    <text x="590" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Global Gateway</text>
    <text x="590" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Shared</text>
    
    <!-- Bidirectional VPN connections -->
    <path d="M 180 50 Q 215 50 250 50" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrowBidir)"/>
    <text x="215" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">VPN</text>
    
    <path d="M 430 50 Q 465 50 500 50" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrowBidir)"/>
    <text x="465" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">VPN</text>
  </g>
  
  <!-- ASIA Region (below Core) -->
  <g transform="translate(250, 200)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="url(#asiaBox)" filter="url(#shadow7)"/>
    <text x="90" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">ASIA Region</text>
    <text x="90" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Global Gateway</text>
    <text x="90" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Shared</text>
    
    <!-- VPN connection from Core to ASIA -->
    <path d="M 90 -120 Q 90 -60 90 0" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrowBidir)"/>
    <text x="110" y="-60" font-family="Arial, sans-serif" font-size="8" fill="#555">VPN</text>
  </g>
  
  <!-- JSZ (separate, one-way) -->
  <g transform="translate(550, 200)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="url(#jszBox)" filter="url(#shadow7)"/>
    <text x="90" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">JSZ</text>
    <text x="90" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Japan Secure</text>
    <text x="90" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Zone</text>
    
    <!-- One-way connection from Core to JSZ -->
    <path d="M 340 100 Q 445 100 550 150" stroke="#e74c3c" stroke-width="3" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowOneWay)"/>
    <text x="445" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c" font-weight="bold">ONE-WAY</text>
    <text x="445" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c">(Config Only)</text>
  </g>
  
  <!-- Communication Rules Table -->
  <g transform="translate(50, 330)">
    <rect width="800" height="200" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Inter-Region VPN Rules</text>
    
    <!-- Table Header -->
    <rect x="20" y="40" width="760" height="30" rx="3" fill="#34495e"/>
    <text x="120" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">From</text>
    <text x="250" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">To</text>
    <text x="350" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Port</text>
    <text x="450" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Protocol</text>
    <text x="600" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Description</text>
    
    <!-- Table Rows -->
    <rect x="20" y="75" width="760" height="20" rx="2" fill="white"/>
    <text x="120" y="90" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">US Inner</text>
    <text x="250" y="90" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Core Zone</text>
    <text x="350" y="90" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">3306</text>
    <text x="450" y="90" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">TCP/TLS</text>
    <text x="600" y="90" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">MySQL sync</text>
    
    <rect x="20" y="100" width="760" height="20" rx="2" fill="#f8f9fa"/>
    <text x="120" y="115" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">US Inner</text>
    <text x="250" y="115" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Core Zone</text>
    <text x="350" y="115" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">443</text>
    <text x="450" y="115" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">TCP/HTTPS</text>
    <text x="600" y="115" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">ES analytics</text>
    
    <rect x="20" y="125" width="760" height="20" rx="2" fill="white"/>
    <text x="120" y="140" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">EU Inner</text>
    <text x="250" y="140" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Core Zone</text>
    <text x="350" y="140" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">3306</text>
    <text x="450" y="140" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">TCP/TLS</text>
    <text x="600" y="140" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">MySQL sync</text>
    
    <rect x="20" y="150" width="760" height="20" rx="2" fill="#f8f9fa"/>
    <text x="120" y="165" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">ASIA Inner</text>
    <text x="250" y="165" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Core Zone</text>
    <text x="350" y="165" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">3306</text>
    <text x="450" y="165" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">TCP/TLS</text>
    <text x="600" y="165" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">MySQL sync</text>
    
    <rect x="20" y="175" width="760" height="20" rx="2" fill="#ffe6e6"/>
    <text x="120" y="190" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">Core Zone</text>
    <text x="250" y="190" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">JSZ Config</text>
    <text x="350" y="190" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">443</text>
    <text x="450" y="190" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">TCP/HTTPS</text>
    <text x="600" y="190" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">Config export (one-way)</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 520)">
    <line x1="0" y1="5" x2="30" y2="5" stroke="#555" stroke-width="3"/>
    <text x="40" y="8" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Bidirectional VPN</text>
    
    <line x1="200" y1="5" x2="230" y2="5" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,3"/>
    <text x="240" y="8" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">One-way (JSZ)</text>
  </g>
</svg>

