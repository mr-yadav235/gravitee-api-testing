<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="900" height="700" fill="#ffffff"/>
  
  <defs>
    <linearGradient id="internetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outerDmzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerDmzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="appZoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coreZoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e44ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7d3c98;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Arrow marker definition -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Network Zone Architecture Model</text>

  <!-- Internet -->
  <rect x="50" y="60" width="800" height="50" rx="10" fill="url(#internetGrad)" filter="url(#shadow)"/>
  <text x="450" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">INTERNET</text>
  
  <!-- Arrow down -->
  <path d="M 450 120 L 450 150" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="460" y="140" font-family="Arial, sans-serif" font-size="11" fill="#34495e">HTTPS (443)</text>
  
  <!-- Outer DMZ -->
  <rect x="50" y="160" width="800" height="100" rx="10" fill="url(#outerDmzGrad)" filter="url(#shadow)"/>
  <text x="450" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">OUTER DMZ (Zone 1)</text>
  <text x="450" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Edge Security • DDoS Protection • SSL Termination</text>
  
  <rect x="100" y="220" width="150" height="30" rx="5" fill="rgba(255,255,255,0.3)"/>
  <text x="175" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">WAF</text>
  
  <rect x="280" y="220" width="150" height="30" rx="5" fill="rgba(255,255,255,0.3)"/>
  <text x="355" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">DDoS Protection</text>
  
  <rect x="460" y="220" width="150" height="30" rx="5" fill="rgba(255,255,255,0.3)"/>
  <text x="535" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Load Balancer</text>
  
  <rect x="640" y="220" width="150" height="30" rx="5" fill="rgba(255,255,255,0.3)"/>
  <text x="715" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">SSL Termination</text>
  
  <!-- Arrow down -->
  <path d="M 450 270 L 450 300" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="460" y="290" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Internal (8082)</text>
  
  <!-- Inner DMZ -->
  <rect x="50" y="310" width="800" height="120" rx="10" fill="url(#innerDmzGrad)" filter="url(#shadow)"/>
  <text x="450" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">INNER DMZ (Zone 2)</text>
  <text x="450" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">API Gateway Processing • Policy Enforcement</text>
  
  <rect x="150" y="370" width="120" height="40" rx="5" fill="rgba(255,255,255,0.3)"/>
  <text x="210" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Gateway 1</text>
  <text x="210" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Routing • Auth</text>
  
  <rect x="290" y="370" width="120" height="40" rx="5" fill="rgba(255,255,255,0.3)"/>
  <text x="350" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Gateway 2</text>
  <text x="350" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Rate Limit</text>
  
  <rect x="430" y="370" width="120" height="40" rx="5" fill="rgba(255,255,255,0.3)"/>
  <text x="490" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Gateway 3</text>
  <text x="490" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Transform</text>
  
  <rect x="570" y="370" width="120" height="40" rx="5" fill="rgba(255,255,255,0.3)"/>
  <text x="630" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Gateway N</text>
  <text x="630" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Validation</text>
  
  <!-- Arrow down -->
  <path d="M 450 440 L 450 470" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="460" y="460" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Backend Calls (mTLS)</text>
  
  <!-- Application Zone -->
  <rect x="50" y="480" width="800" height="80" rx="10" fill="url(#appZoneGrad)" filter="url(#shadow)"/>
  <text x="450" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">APPLICATION ZONE (Zone 3)</text>
  <text x="450" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Backend Services • Microservices</text>
  
  <rect x="150" y="540" width="120" height="30" rx="5" fill="rgba(255,255,255,0.3)"/>
  <text x="210" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Service A (K8s)</text>
  
  <rect x="290" y="540" width="120" height="30" rx="5" fill="rgba(255,255,255,0.3)"/>
  <text x="350" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Service B (Container)</text>
  
  <rect x="430" y="540" width="120" height="30" rx="5" fill="rgba(255,255,255,0.3)"/>
  <text x="490" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Service C (Container)</text>
  
  <rect x="570" y="540" width="120" height="30" rx="5" fill="rgba(255,255,255,0.3)"/>
  <text x="630" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Service N (VM)</text>
  
  <!-- Arrow down -->
  <path d="M 450 570 L 450 600" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="460" y="590" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Config Sync / Analytics (TLS + VPN)</text>
  
  <!-- Core Zone -->
  <rect x="50" y="610" width="800" height="80" rx="10" fill="url(#coreZoneGrad)" filter="url(#shadow)"/>
  <text x="450" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">CORE ZONE (Zone 4)</text>
  <text x="450" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Centralized Control Plane • Shared Data Stores</text>
  
  <rect x="150" y="670" width="120" height="15" rx="3" fill="rgba(255,255,255,0.3)"/>
  <text x="210" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Management API</text>
  
  <rect x="290" y="670" width="120" height="15" rx="3" fill="rgba(255,255,255,0.3)"/>
  <text x="350" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Console UI</text>
  
  <rect x="430" y="670" width="120" height="15" rx="3" fill="rgba(255,255,255,0.3)"/>
  <text x="490" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Developer Portal</text>
  
  <rect x="570" y="670" width="120" height="15" rx="3" fill="rgba(255,255,255,0.3)"/>
  <text x="630" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">MySQL Database</text>
  
  <rect x="350" y="690" width="200" height="15" rx="3" fill="rgba(255,255,255,0.3)"/>
  <text x="450" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Elasticsearch Cluster</text>
</svg>

