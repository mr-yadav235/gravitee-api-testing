<svg width="950" height="1100" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="950" height="1100" fill="#f8f9fa"/>
  
  <defs>
    <linearGradient id="internetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outerDmzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerDmzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="appZoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coreZoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e44ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7d3c98;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e" />
    </marker>
  </defs>

  <!-- Outer Container Box -->
  <rect x="20" y="20" width="910" height="1060" rx="15" fill="none" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Title -->
  <text x="475" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">NETWORK ZONE MODEL</text>

  <!-- ==================== INTERNET ==================== -->
  <rect x="50" y="80" width="850" height="50" rx="8" fill="url(#internetGrad)" filter="url(#shadow)"/>
  <text x="475" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">INTERNET</text>
  
  <!-- Arrow: Internet to Outer DMZ -->
  <line x1="475" y1="130" x2="475" y2="155" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="490" y="148" font-family="Arial, sans-serif" font-size="10" fill="#34495e">HTTPS (443)</text>

  <!-- ==================== OUTER DMZ (Zone 1) ==================== -->
  <rect x="50" y="165" width="850" height="195" rx="8" fill="url(#outerDmzGrad)" filter="url(#shadow)"/>
  <text x="475" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">OUTER DMZ (Zone 1)</text>
  
  <text x="70" y="215" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.95)">Purpose: Edge security, DDoS protection, SSL termination</text>
  
  <text x="70" y="240" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Components:</text>
  
  <!-- Components boxes -->
  <rect x="70" y="250" width="170" height="45" rx="5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="155" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">WAF</text>
  
  <rect x="260" y="250" width="170" height="45" rx="5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="345" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">DDoS</text>
  <text x="345" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Protection</text>
  
  <rect x="450" y="250" width="170" height="45" rx="5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="535" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">CDN</text>
  <text x="535" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Cache</text>
  
  <rect x="640" y="250" width="170" height="45" rx="5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="725" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Public</text>
  <text x="725" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">LB</text>
  
  <text x="70" y="315" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Security Controls:</text>
  <text x="70" y="332" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">• Rate limiting (10,000 req/sec per IP)  • Geo-blocking  • Bot detection  • OWASP Top 10  • SSL/TLS 1.3</text>

  <!-- Arrow: Outer DMZ to Inner DMZ -->
  <line x1="475" y1="360" x2="475" y2="390" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="490" y="375" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Internal (8082)</text>
  <text x="490" y="388" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">(Encrypted)</text>

  <!-- ==================== INNER DMZ (Zone 2) ==================== -->
  <rect x="50" y="400" width="850" height="250" rx="8" fill="url(#innerDmzGrad)" filter="url(#shadow)"/>
  <text x="475" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">INNER DMZ (Zone 2)</text>
  
  <text x="70" y="450" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.95)">Purpose: API Gateway processing, policy enforcement</text>
  
  <text x="70" y="475" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Components:</text>
  
  <!-- API Gateway Cluster Box -->
  <rect x="70" y="485" width="810" height="115" rx="5" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <text x="475" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">API GATEWAY CLUSTER</text>
  
  <!-- Gateway 1 -->
  <rect x="100" y="515" width="200" height="75" rx="5" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
  <text x="200" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Gateway 1</text>
  <text x="110" y="553" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Routing</text>
  <text x="110" y="566" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Auth</text>
  <text x="110" y="579" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Rate Limit</text>
  <text x="200" y="553" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Transform</text>
  
  <!-- Gateway 2 -->
  <rect x="330" y="515" width="200" height="75" rx="5" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
  <text x="430" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Gateway 2</text>
  <text x="340" y="553" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Routing</text>
  <text x="340" y="566" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Auth</text>
  <text x="340" y="579" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Rate Limit</text>
  <text x="430" y="553" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Transform</text>
  
  <!-- Gateway N -->
  <rect x="560" y="515" width="200" height="75" rx="5" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
  <text x="660" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Gateway N</text>
  <text x="570" y="553" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Routing</text>
  <text x="570" y="566" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Auth</text>
  <text x="570" y="579" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Rate Limit</text>
  <text x="660" y="553" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Transform</text>
  
  <text x="70" y="620" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Security Controls:</text>
  <text x="70" y="637" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">• API key validation  • OAuth2/JWT verification  • Request/response transformation  • Payload validation  • Per-API rate limiting</text>

  <!-- Arrow: Inner DMZ to Application Zone -->
  <line x1="475" y1="650" x2="475" y2="685" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="490" y="665" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Backend Calls</text>
  <text x="490" y="678" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">(mTLS)</text>

  <!-- ==================== APPLICATION ZONE (Zone 3) ==================== -->
  <rect x="50" y="695" width="850" height="130" rx="8" fill="url(#appZoneGrad)" filter="url(#shadow)"/>
  <text x="475" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">APPLICATION ZONE (Zone 3)</text>
  
  <text x="70" y="745" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.95)">Purpose: Backend services, microservices</text>
  
  <!-- Service boxes -->
  <rect x="70" y="760" width="180" height="50" rx="5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="160" y="782" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Service A</text>
  <text x="160" y="798" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">(K8s)</text>
  
  <rect x="270" y="760" width="180" height="50" rx="5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="360" y="782" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Service B</text>
  <text x="360" y="798" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">(Container)</text>
  
  <rect x="470" y="760" width="180" height="50" rx="5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="560" y="782" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Service C</text>
  <text x="560" y="798" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">(Container)</text>
  
  <rect x="670" y="760" width="180" height="50" rx="5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="760" y="782" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Service N</text>
  <text x="760" y="798" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">(VM)</text>

  <!-- Arrow: Application Zone to Core Zone -->
  <line x1="475" y1="825" x2="475" y2="860" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="490" y="840" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Config Sync / Analytics</text>
  <text x="490" y="853" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">(TLS + VPN)</text>

  <!-- ==================== CORE ZONE (Zone 4) ==================== -->
  <rect x="50" y="870" width="850" height="190" rx="8" fill="url(#coreZoneGrad)" filter="url(#shadow)"/>
  <text x="475" y="895" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">CORE ZONE (Zone 4)</text>
  
  <text x="70" y="920" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.95)">Purpose: Centralized control plane, shared data stores</text>
  
  <!-- Core Zone components - row 1 -->
  <rect x="70" y="935" width="180" height="50" rx="5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="160" y="957" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Management</text>
  <text x="160" y="973" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">API</text>
  
  <rect x="270" y="935" width="180" height="50" rx="5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="360" y="957" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Console</text>
  <text x="360" y="973" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">UI</text>
  
  <rect x="470" y="935" width="180" height="50" rx="5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="560" y="962" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Portal</text>
  
  <rect x="670" y="935" width="180" height="50" rx="5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="760" y="957" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">MySQL</text>
  <text x="760" y="973" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Database</text>
  
  <!-- Elasticsearch - separate box -->
  <rect x="70" y="1000" width="180" height="50" rx="5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="160" y="1022" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Elasticsearch</text>
  <text x="160" y="1038" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Cluster</text>

</svg>
