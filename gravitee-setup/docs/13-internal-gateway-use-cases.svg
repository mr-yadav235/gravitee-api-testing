<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900">
  <defs>
    <linearGradient id="useCaseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="case1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="case2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d35400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="case3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e8449;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="case4Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="900" fill="#f8f9fa"/>
  
  <!-- Main Container -->
  <rect x="20" y="20" width="960" height="860" rx="15" fill="url(#useCaseBg)" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Title -->
  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">INTERNAL GATEWAY USE CASES</text>

  <!-- ==================== USE CASE 1: SERVICE-TO-SERVICE ==================== -->
  <rect x="40" y="80" width="920" height="180" rx="10" fill="url(#case1Grad)" filter="url(#shadow)"/>
  <text x="500" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">USE CASE 1: SERVICE-TO-SERVICE COMMUNICATION</text>
  
  <!-- Flow boxes -->
  <rect x="70" y="130" width="180" height="80" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="160" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Order Service</text>
  <text x="160" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">POST /order</text>
  <text x="160" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2ecc71">mTLS</text>
  
  <line x1="255" y1="170" x2="310" y2="170" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="320" y="130" width="180" height="80" rx="8" fill="url(#gatewayGrad)"/>
  <text x="410" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Internal Gateway</text>
  <text x="410" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">/api/inventory</text>
  
  <line x1="505" y1="170" x2="560" y2="170" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="570" y="130" width="180" height="80" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="660" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Inventory Service</text>
  <text x="660" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">GET /stock</text>
  <text x="660" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2ecc71">mTLS</text>
  
  <!-- Benefits -->
  <rect x="780" y="125" width="160" height="90" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="860" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Benefits:</text>
  <text x="790" y="163" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Centralized auth</text>
  <text x="790" y="178" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Traffic monitoring</text>
  <text x="790" y="193" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Rate limiting</text>
  <text x="790" y="208" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Circuit breaker</text>

  <!-- ==================== USE CASE 2: ADMIN API ACCESS ==================== -->
  <rect x="40" y="275" width="920" height="180" rx="10" fill="url(#case2Grad)" filter="url(#shadow)"/>
  <text x="500" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">USE CASE 2: ADMIN API ACCESS</text>
  
  <!-- Flow boxes -->
  <rect x="70" y="325" width="180" height="80" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="160" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Admin Console</text>
  <text x="160" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Grafana / Kibana</text>
  <text x="160" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2ecc71">JWT</text>
  
  <line x1="255" y1="365" x2="310" y2="365" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="320" y="325" width="180" height="80" rx="8" fill="url(#gatewayGrad)"/>
  <text x="410" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Internal Gateway</text>
  <text x="410" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">/admin/ /metrics/</text>
  
  <line x1="505" y1="365" x2="560" y2="365" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="570" y="325" width="180" height="80" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="660" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Admin API</text>
  <text x="660" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Metrics / Config</text>
  <text x="660" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2ecc71">JWT</text>
  
  <!-- Benefits -->
  <rect x="780" y="320" width="160" height="90" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="860" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Benefits:</text>
  <text x="790" y="358" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Centralized access</text>
  <text x="790" y="373" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Audit logging</text>
  <text x="790" y="388" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• RBAC</text>

  <!-- ==================== USE CASE 3: CI/CD PIPELINE ==================== -->
  <rect x="40" y="470" width="920" height="180" rx="10" fill="url(#case3Grad)" filter="url(#shadow)"/>
  <text x="500" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">USE CASE 3: CI/CD PIPELINE INTEGRATION</text>
  
  <!-- Flow boxes -->
  <rect x="70" y="520" width="180" height="80" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="160" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">CI/CD Pipeline</text>
  <text x="160" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Jenkins / ArgoCD</text>
  <text x="160" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f1c40f">Token</text>
  
  <line x1="255" y1="560" x2="310" y2="560" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="320" y="520" width="180" height="80" rx="8" fill="url(#gatewayGrad)"/>
  <text x="410" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Internal Gateway</text>
  <text x="410" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">/deploy/ /config/</text>
  
  <line x1="505" y1="560" x2="560" y2="560" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="570" y="520" width="180" height="80" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="660" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Deploy Service</text>
  <text x="660" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">K8s API / Config</text>
  <text x="660" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f1c40f">Token</text>
  
  <!-- Benefits -->
  <rect x="780" y="515" width="160" height="90" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="860" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Benefits:</text>
  <text x="790" y="553" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Secure deploy API</text>
  <text x="790" y="568" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Audit trail</text>
  <text x="790" y="583" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Rate limiting</text>

  <!-- ==================== USE CASE 4: INTERNAL APPLICATION ==================== -->
  <rect x="40" y="665" width="920" height="195" rx="10" fill="url(#case4Grad)" filter="url(#shadow)"/>
  <text x="500" y="695" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">USE CASE 4: INTERNAL APPLICATION ACCESS</text>
  
  <!-- Flow boxes -->
  <rect x="70" y="715" width="180" height="95" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="160" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Internal Web App</text>
  <text x="160" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">CRM / ERP</text>
  <text x="160" y="780" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">HR Portal</text>
  <text x="160" y="800" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f1c40f">SSO</text>
  
  <line x1="255" y1="760" x2="310" y2="760" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="320" y="715" width="180" height="95" rx="8" fill="url(#gatewayGrad)"/>
  <text x="410" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Internal Gateway</text>
  <text x="410" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">/crm/ /erp/ /hr/</text>
  
  <line x1="505" y1="760" x2="560" y2="760" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="570" y="715" width="180" height="95" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="660" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Backend APIs</text>
  <text x="660" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Customer / Finance</text>
  <text x="660" y="780" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Employee</text>
  <text x="660" y="800" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f1c40f">SSO</text>
  
  <!-- Benefits -->
  <rect x="780" y="710" width="160" height="100" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="860" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Benefits:</text>
  <text x="790" y="750" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• SSO integration</text>
  <text x="790" y="768" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Unified API access</text>
  <text x="790" y="786" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">• Consistent policies</text>
</svg>

