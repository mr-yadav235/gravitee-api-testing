<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="authGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="authzGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="networkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e8449;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mtlsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jwtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="saGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="750" fill="#f8f9fa"/>
  
  <!-- Main Container -->
  <rect x="20" y="20" width="960" height="710" rx="15" fill="url(#secBg)" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Title -->
  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">INTERNAL GATEWAY SECURITY MODEL</text>

  <!-- ==================== AUTHENTICATION METHODS ==================== -->
  <rect x="40" y="80" width="920" height="180" rx="10" fill="url(#authGrad)" filter="url(#shadow)"/>
  <text x="500" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">AUTHENTICATION METHODS</text>
  
  <!-- mTLS -->
  <rect x="70" y="130" width="260" height="110" rx="8" fill="url(#mtlsGrad)" filter="url(#shadow)"/>
  <text x="200" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">mTLS</text>
  <text x="85" y="178" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.95)">• Client certificate</text>
  <text x="85" y="196" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.95)">• Server certificate</text>
  <text x="85" y="214" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.95)">• Mutual authentication</text>
  <text x="85" y="232" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.95)">• End-to-end encryption</text>
  
  <!-- JWT -->
  <rect x="360" y="130" width="260" height="110" rx="8" fill="url(#jwtGrad)" filter="url(#shadow)"/>
  <text x="490" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">JWT</text>
  <text x="375" y="178" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.95)">• Token-based auth</text>
  <text x="375" y="196" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.95)">• Claims verification</text>
  <text x="375" y="214" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.95)">• Expiry check</text>
  <text x="375" y="232" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.95)">• Signature validation</text>
  
  <!-- Service Account -->
  <rect x="650" y="130" width="280" height="110" rx="8" fill="url(#saGrad)" filter="url(#shadow)"/>
  <text x="790" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Service Account</text>
  <text x="665" y="178" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.95)">• K8s Service Account</text>
  <text x="665" y="196" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.95)">• SPIFFE/SPIRE</text>
  <text x="665" y="214" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.95)">• Workload Identity</text>
  <text x="665" y="232" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.95)">• Pod identity binding</text>

  <!-- ==================== AUTHORIZATION POLICIES ==================== -->
  <rect x="40" y="280" width="920" height="280" rx="10" fill="url(#authzGrad)" filter="url(#shadow)"/>
  <text x="500" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">AUTHORIZATION POLICIES</text>
  
  <!-- Service A -->
  <rect x="60" y="330" width="280" height="130" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)"/>
  <text x="200" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Service A (Order Service)</text>
  <text x="75" y="378" font-family="Arial, sans-serif" font-size="10" fill="#2ecc71">✓ Can access: /api/inventory (GET)</text>
  <text x="75" y="396" font-family="Arial, sans-serif" font-size="10" fill="#2ecc71">✓ Can access: /api/payment (POST)</text>
  <text x="75" y="414" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">✗ Cannot access: /api/admin/*</text>
  <text x="75" y="450" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.7)">Rate: 1000 req/min</text>
  
  <!-- Service B -->
  <rect x="360" y="330" width="280" height="130" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)"/>
  <text x="500" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Service B (Admin Service)</text>
  <text x="375" y="378" font-family="Arial, sans-serif" font-size="10" fill="#2ecc71">✓ Can access: /api/admin/* (ALL)</text>
  <text x="375" y="396" font-family="Arial, sans-serif" font-size="10" fill="#2ecc71">✓ Can access: /api/config (GET, PUT)</text>
  <text x="375" y="414" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">✗ Cannot access: /api/payment/*</text>
  <text x="375" y="450" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.7)">Rate: 500 req/min</text>
  
  <!-- CI/CD Pipeline -->
  <rect x="660" y="330" width="280" height="130" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)"/>
  <text x="800" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">CI/CD Pipeline</text>
  <text x="675" y="378" font-family="Arial, sans-serif" font-size="10" fill="#2ecc71">✓ Can access: /deploy/* (POST)</text>
  <text x="675" y="396" font-family="Arial, sans-serif" font-size="10" fill="#2ecc71">✓ Can access: /config/* (GET, PUT)</text>
  <text x="675" y="414" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">⚠ Rate limited: 10 req/min</text>
  <text x="675" y="450" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.7)">Deployment-specific limits</text>

  <!-- Policy Legend -->
  <rect x="60" y="475" width="880" height="65" rx="6" fill="rgba(255,255,255,0.1)"/>
  <text x="500" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Policy Enforcement Flow</text>
  <text x="100" y="520" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Request → Identity Check → Policy Lookup → Permission Verify → Rate Limit Check → Allow/Deny</text>

  <!-- ==================== NETWORK SECURITY ==================== -->
  <rect x="40" y="580" width="920" height="130" rx="10" fill="url(#networkGrad)" filter="url(#shadow)"/>
  <text x="500" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">NETWORK SECURITY</text>
  
  <rect x="60" y="630" width="880" height="65" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="85" y="652" font-family="Arial, sans-serif" font-size="10" fill="white">• Internal Gateway only accessible from Core Zone network</text>
  <text x="85" y="670" font-family="Arial, sans-serif" font-size="10" fill="white">• No internet ingress or egress</text>
  <text x="400" y="652" font-family="Arial, sans-serif" font-size="10" fill="white">• All traffic encrypted with mTLS</text>
  <text x="400" y="670" font-family="Arial, sans-serif" font-size="10" fill="white">• Network policies restrict pod-to-pod</text>
  <text x="700" y="652" font-family="Arial, sans-serif" font-size="10" fill="white">• Service mesh integration (optional)</text>
  <text x="700" y="670" font-family="Arial, sans-serif" font-size="10" fill="white">• Istio / Linkerd compatible</text>
</svg>

