<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dnsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outerDmzGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerDmzGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d35400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="appZoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e8449;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="analyticsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowDown" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#3498db"/>
    </marker>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="1100" fill="#f8f9fa"/>
  
  <!-- Main Container -->
  <rect x="20" y="20" width="960" height="1060" rx="15" fill="url(#flowBg)" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Title -->
  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">GLOBAL API REQUEST FLOW</text>

  <!-- ==================== API CLIENT ==================== -->
  <rect x="400" y="80" width="200" height="70" rx="10" fill="url(#clientGrad)" filter="url(#shadow)"/>
  <text x="500" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">API Client</text>
  <text x="500" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">(US Based)</text>
  
  <!-- Step 1 -->
  <line x1="500" y1="150" x2="500" y2="180" stroke="#3498db" stroke-width="2"/>
  <text x="520" y="170" font-family="Arial, sans-serif" font-size="10" fill="#555">1. DNS Query: api.company.com</text>
  
  <!-- ==================== GEODNS ==================== -->
  <rect x="400" y="185" width="200" height="70" rx="10" fill="url(#dnsGrad)" filter="url(#shadow)"/>
  <text x="500" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">GeoDNS / GSLB</text>
  <text x="500" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Returns: us-api.company.com</text>
  
  <!-- Step 2 -->
  <line x1="500" y1="255" x2="500" y2="285" stroke="#9b59b6" stroke-width="2"/>
  <text x="520" y="275" font-family="Arial, sans-serif" font-size="10" fill="#555">2. HTTPS Request to US Region</text>

  <!-- ==================== US REGION ==================== -->
  <rect x="50" y="290" width="900" height="620" rx="12" fill="rgba(52,152,219,0.1)" stroke="#3498db" stroke-width="2"/>
  <text x="500" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2980b9">US REGION</text>

  <!-- OUTER DMZ -->
  <rect x="70" y="330" width="860" height="120" rx="10" fill="url(#outerDmzGrad)" filter="url(#shadow)"/>
  <text x="500" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">OUTER DMZ</text>
  
  <!-- Steps 3-5 -->
  <rect x="100" y="370" width="150" height="60" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="175" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">3. WAF</text>
  <text x="175" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Inspection</text>
  
  <line x1="255" y1="400" x2="290" y2="400" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="300" y="370" width="150" height="60" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="375" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">4. DDoS</text>
  <text x="375" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Protection</text>
  
  <line x1="455" y1="400" x2="490" y2="400" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="500" y="370" width="150" height="60" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="575" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">5. SSL</text>
  <text x="575" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Termination</text>

  <!-- Arrow down -->
  <line x1="575" y1="430" x2="575" y2="465" stroke="#e74c3c" stroke-width="2"/>

  <!-- INNER DMZ -->
  <rect x="70" y="470" width="860" height="200" rx="10" fill="url(#innerDmzGrad)" filter="url(#shadow)"/>
  <text x="500" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">INNER DMZ - API GATEWAY</text>
  
  <!-- Steps 6-10 -->
  <rect x="90" y="515" width="130" height="60" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="155" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">6. Route</text>
  <text x="155" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Match</text>
  
  <line x1="225" y1="545" x2="245" y2="545" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="255" y="515" width="130" height="60" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="320" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">7. Auth</text>
  <text x="320" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Check</text>
  
  <line x1="390" y1="545" x2="410" y2="545" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="420" y="515" width="130" height="60" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="485" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">8. Rate</text>
  <text x="485" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Limit</text>
  
  <line x1="555" y1="545" x2="575" y2="545" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="585" y="515" width="130" height="60" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="650" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">9. Policy</text>
  <text x="650" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Apply</text>
  
  <line x1="720" y1="545" x2="740" y2="545" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="750" y="515" width="130" height="60" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="815" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">10. Backend</text>
  <text x="815" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Call</text>

  <!-- Gateway details -->
  <rect x="90" y="590" width="790" height="65" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="485" y="612" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Gateway Processing: Request validation → Transform → Route to backend → Response transform → Return</text>
  <text x="485" y="632" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Latency added: ~5-15ms | Policies applied: Auth, Rate Limit, Quota, Transform, Logging</text>

  <!-- Arrow down -->
  <line x1="500" y1="670" x2="500" y2="700" stroke="#e67e22" stroke-width="2"/>

  <!-- APPLICATION ZONE -->
  <rect x="70" y="705" width="860" height="120" rx="10" fill="url(#appZoneGrad)" filter="url(#shadow)"/>
  <text x="500" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">APPLICATION ZONE</text>
  
  <rect x="350" y="745" width="300" height="60" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="500" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">11. Backend Service Processing</text>
  <text x="500" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Business Logic Execution</text>
  
  <!-- Response -->
  <line x1="500" y1="825" x2="500" y2="865" stroke="#27ae60" stroke-width="2"/>
  <text x="520" y="845" font-family="Arial, sans-serif" font-size="10" fill="#555">12. Response</text>

  <!-- Response to client -->
  <rect x="350" y="870" width="300" height="50" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
  <text x="500" y="895" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">13. API Client</text>
  <text x="500" y="912" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">◄── 200 OK + Response Body</text>

  <!-- ==================== ASYNC ANALYTICS ==================== -->
  <rect x="50" y="940" width="900" height="120" rx="10" fill="url(#analyticsGrad)" filter="url(#shadow)"/>
  <text x="500" y="970" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">ASYNC: ANALYTICS FLOW</text>
  
  <rect x="80" y="990" width="140" height="50" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="150" y="1015" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Gateway</text>
  <text x="150" y="1030" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">14. Log Request</text>
  
  <line x1="225" y1="1015" x2="290" y2="1015" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="300" y="990" width="180" height="50" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="390" y="1015" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">15. Push to ES</text>
  <text x="390" y="1030" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Async Bulk Insert</text>
  
  <line x1="485" y1="1015" x2="550" y2="1015" stroke="white" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <rect x="560" y="990" width="360" height="50" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="740" y="1015" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Core Zone Elasticsearch</text>
  <text x="740" y="1030" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">gravitee-request-us-* index</text>
</svg>

