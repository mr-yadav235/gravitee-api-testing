<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 950">
  <defs>
    <linearGradient id="syncBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="adminGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="usGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e8449;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="euGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="asiaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jszGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowDown" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#555"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="950" fill="#f8f9fa"/>
  
  <!-- Main Container -->
  <rect x="20" y="20" width="960" height="910" rx="15" fill="url(#syncBg)" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Title -->
  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">CONFIGURATION SYNC FLOW</text>

  <!-- ==================== ADMIN USER ==================== -->
  <rect x="400" y="80" width="200" height="60" rx="10" fill="url(#adminGrad)" filter="url(#shadow)"/>
  <text x="500" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Admin User</text>
  <text x="500" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">1. Create/Update API</text>
  
  <!-- Arrow -->
  <line x1="500" y1="140" x2="500" y2="170" stroke="#3498db" stroke-width="2"/>

  <!-- ==================== CORE ZONE ==================== -->
  <rect x="50" y="175" width="900" height="350" rx="12" fill="url(#coreGrad)" filter="url(#shadow)"/>
  <text x="500" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">CORE ZONE</text>
  
  <!-- Console UI -->
  <rect x="400" y="220" width="200" height="60" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="500" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Console UI</text>
  <text x="500" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">2. API Call</text>
  
  <line x1="500" y1="280" x2="500" y2="305" stroke="white" stroke-width="2"/>
  
  <!-- Management API -->
  <rect x="400" y="310" width="200" height="60" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
  <text x="500" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Management API</text>
  <text x="500" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">3. Store</text>
  
  <line x1="500" y1="370" x2="500" y2="395" stroke="white" stroke-width="2"/>
  
  <!-- MySQL -->
  <rect x="400" y="400" width="200" height="70" rx="8" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.5)"/>
  <text x="500" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">MySQL Database</text>
  <text x="500" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">API Definition stored</text>
  <text x="500" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">4. Trigger Sync Event</text>

  <!-- Branch lines -->
  <line x1="500" y1="470" x2="500" y2="520" stroke="white" stroke-width="2"/>
  <line x1="130" y1="520" x2="870" y2="520" stroke="white" stroke-width="2"/>
  <line x1="130" y1="520" x2="130" y2="560" stroke="white" stroke-width="2"/>
  <line x1="370" y1="520" x2="370" y2="560" stroke="white" stroke-width="2"/>
  <line x1="630" y1="520" x2="630" y2="560" stroke="white" stroke-width="2"/>
  <line x1="870" y1="520" x2="870" y2="560" stroke="white" stroke-width="2"/>

  <!-- ==================== REGIONS ==================== -->
  
  <!-- US Region -->
  <rect x="70" y="565" width="180" height="250" rx="10" fill="url(#usGrad)" filter="url(#shadow)"/>
  <text x="160" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">US Region</text>
  
  <rect x="90" y="605" width="140" height="50" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="160" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">5a. Poll MySQL</text>
  <text x="160" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Auto Sync</text>
  
  <line x1="160" y1="660" x2="160" y2="680" stroke="white" stroke-width="2"/>
  
  <rect x="90" y="685" width="140" height="50" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="160" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Gateway Cluster</text>
  <text x="160" y="722" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">6. Deploy API</text>
  
  <line x1="160" y1="740" x2="160" y2="760" stroke="white" stroke-width="2"/>
  
  <rect x="90" y="765" width="140" height="35" rx="6" fill="rgba(39,174,96,0.4)"/>
  <text x="160" y="787" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">✓ API Ready</text>
  
  <!-- EU Region -->
  <rect x="290" y="565" width="180" height="250" rx="10" fill="url(#euGrad)" filter="url(#shadow)"/>
  <text x="380" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">EU Region</text>
  
  <rect x="310" y="605" width="140" height="50" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="380" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">5b. Poll MySQL</text>
  <text x="380" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Auto Sync</text>
  
  <line x1="380" y1="660" x2="380" y2="680" stroke="white" stroke-width="2"/>
  
  <rect x="310" y="685" width="140" height="50" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="380" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Gateway Cluster</text>
  <text x="380" y="722" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">6. Deploy API</text>
  
  <line x1="380" y1="740" x2="380" y2="760" stroke="white" stroke-width="2"/>
  
  <rect x="310" y="765" width="140" height="35" rx="6" fill="rgba(39,174,96,0.4)"/>
  <text x="380" y="787" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">✓ API Ready</text>
  
  <!-- ASIA Region -->
  <rect x="510" y="565" width="180" height="250" rx="10" fill="url(#asiaGrad)" filter="url(#shadow)"/>
  <text x="600" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">ASIA Region</text>
  
  <rect x="530" y="605" width="140" height="50" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="600" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">5c. Poll MySQL</text>
  <text x="600" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Auto Sync</text>
  
  <line x1="600" y1="660" x2="600" y2="680" stroke="white" stroke-width="2"/>
  
  <rect x="530" y="685" width="140" height="50" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="600" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Gateway Cluster</text>
  <text x="600" y="722" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">6. Deploy API</text>
  
  <line x1="600" y1="740" x2="600" y2="760" stroke="white" stroke-width="2"/>
  
  <rect x="530" y="765" width="140" height="35" rx="6" fill="rgba(39,174,96,0.4)"/>
  <text x="600" y="787" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">✓ API Ready</text>
  
  <!-- JSZ Region -->
  <rect x="730" y="565" width="200" height="250" rx="10" fill="url(#jszGrad)" filter="url(#shadow)"/>
  <text x="830" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">JSZ</text>
  
  <rect x="750" y="605" width="160" height="50" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="830" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">5d. Manual Approval</text>
  <text x="830" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">Required ⚠️</text>
  
  <line x1="830" y1="660" x2="830" y2="680" stroke="white" stroke-width="2"/>
  
  <rect x="750" y="685" width="160" height="50" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="830" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Config Gateway</text>
  <text x="830" y="722" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)">6. Manual Import</text>
  
  <line x1="830" y1="740" x2="830" y2="760" stroke="white" stroke-width="2"/>
  
  <rect x="750" y="765" width="160" height="35" rx="6" fill="rgba(231,76,60,0.4)"/>
  <text x="830" y="787" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">🔒 Isolated</text>

  <!-- ==================== SYNC TIMING ==================== -->
  <rect x="50" y="840" width="900" height="70" rx="10" fill="rgba(52,152,219,0.2)" stroke="#3498db" stroke-width="2"/>
  <text x="500" y="865" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Sync Timing</text>
  <text x="280" y="890" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">US/EU/ASIA: ~5 seconds (automatic)</text>
  <text x="720" y="890" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">JSZ: Manual approval (minutes to hours)</text>
</svg>

